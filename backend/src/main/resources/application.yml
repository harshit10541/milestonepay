spring:
  application:
    name: milestonepay-backend
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5434/postgres}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:dev}
  jpa:
    hibernate:
      ddl-auto: validate   # Flyway owns the schema, Hibernate only checks it
    open-in-view: false

paypal:
  base-url: ${PAYPAL_BASE_URL:https://api-m.sandbox.paypal.com}
  client-id: ${PAYPAL_CLIENT_ID:}
  client-secret: ${PAYPAL_CLIENT_SECRET:}
  # Where PayPal sends the buyer's browser after approving or cancelling the hold.
  # Defaults point at the dev-only endpoints (run with the dev profile).
  return-url: ${PAYPAL_RETURN_URL:http://localhost:8080/dev/payments/return}
  cancel-url: ${PAYPAL_CANCEL_URL:http://localhost:8080/dev/payments/cancel}

management:
  endpoints:
    web:
      exposure:
        include: health
